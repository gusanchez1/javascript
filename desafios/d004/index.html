<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcula Troco</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            padding: 1rem;
        }
    </style>
</head>
<body>
    <h1>Calculando o Troco</h1>
    <button id="btn">Comprar produto</button>

    <script>
        document.getElementById('btn').addEventListener('click', function () {
            var objeto = prompt('Que produto você está comprando?')
            var valorObjeto = Number(prompt(`Quanto custa ${objeto} que você está comprando?`))
            var valorPago = Number(prompt(`Qual foi o valor que você deu para pagar ${objeto}?`))
            var troco = valorPago - valorObjeto

            alert(`Você comprou ${objeto} que custou R$ ${valorObjeto},00
Deu R$ ${valorPago},00 em dinheiro e vai receber R$ ${troco},00 de troco.
Volte Sempre!`)
        })
    </script>
</body>
</html>
