<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situação do aluno</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            padding: 1rem;
            cursor: pointer;
        }

        #resultado p {
            margin: 6px 0;
        }

        .aprovado {
            background-color: limegreen;
            color: darkgreen;
        }

        .reprovado {
            background-color: red;
            color: darkred;
        }

        .recuperacao {
            color: darkgoldenrod;
        }
    </style>
</head>
<body>
    <h1>Situação do aluno</h1>
    <button id="btn">Entrar com as notas</button>
    <div id="resultado">
        <p>Clique no botão acima para informar as notas do aluno.</p>
    </div>

    <script>
        var button = document.getElementById('btn')
        var resultado = document.getElementById('resultado')

        button.addEventListener('click', function () {
            var aluno = prompt('Qual é o nome do aluno?')
            var nota1 = prompt(`Primeira nota de ${aluno}:`)
            var nota2 = prompt(`Segunda nota de ${aluno}:`)

            if (aluno === null || aluno.trim() === '' || nota1 === null || nota1.trim() === '' || nota2 === null || nota2.trim() === '') {
                alert('Operação cancelada ou valor inválido')
                return
            }

            nota1 = Number(nota1)
            nota2 = Number(nota2)

            if (isNaN(nota1) || (isNaN(nota2))) {
                alert('Digite apenas números nos valores das notas')
                return
            }

            resultado.innerHTML = ``

            var h2 = document.createElement('h2')
            h2.innerText = `Analisando a situação de ${aluno}`
            resultado.appendChild(h2)

            var p1 = document.createElement('p')

            var media = (nota1 + nota2) / 2

            p1.innerHTML = `Com as notas ${nota1.toLocaleString('pt-BR')} e ${nota2.toLocaleString('pt-BR')} a <strong>média é ${media.toLocaleString('pt-BR')}</strong>`

            var p2 = document.createElement('p')

            if (media >= 6) {

                p2.innerHTML = `Com média acima de 6,0, o aluno está <strong class='aprovado'>APROVADO</strong>`

            } else if (media < 6 && media >= 3) {

                p2.innerHTML = `Com média entre 3,0 e 6,0 o aluno está em <strong class='recuperacao'>RECUPERAÇÃO</strong>`

            } else {

                p2.innerHTML = `Com média abaixo de 3,0 o aluno está <strong class='reprovado'>REPROVADO</strong>`

            }

            resultado.appendChild(p1)
            resultado.appendChild(p2)
        })
    </script>
</body>
</html>
