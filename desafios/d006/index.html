<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de temperaturas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            padding: 1rem;
        }
    </style>
</head>
<body>
    <h1>Conversor de Temperaturas</h1>
    <button id="btn">Converter</button>
    <h2 id="title"></h2>
    <p id="text">Clique no botão acima para iniciar.</p>
    <script>
        document.getElementById('btn').addEventListener('click', function () {
            var c = Number(prompt('Digite uma temperatura em °C (Celsius)'))

            if (isNaN(c)) {
                alert('Caractere inválido')
                return
            }
            var k = c + 273.15
            var f = (c * 9 / 5) + 32

            var h1 = document.getElementById('title')
            h1.innerHTML = `A temperatura de ${c}°C, corresponde a...`

            var p = document.getElementById('text')
            p.innerHTML = `
            ${k.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} K (Kelvin)<br>
            ${f.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} °F (Fahrenheit)
            `
        })
    </script>
</body>
</html>
