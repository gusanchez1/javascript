<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Sistema de Nacionalidade</h1>
    <p>Digite o país onde você nasceu: <input type="text" name="pais" id="pais"> <input type="button" value="Verificar" onclick="verificar()"></p>
    <div id="res"></div>

    <script>
    function verificar() {
        var paisInput = document.querySelector('#pais')
        var res = document.querySelector('#res')
        var pais = paisInput.value.trim()

        res.innerHTML = `<p>Você nasceu em <strong>${pais}</strong></p>`

        if (pais.toLowerCase() === 'brasil') {
            res.innerHTML += `<p><strong>Brasileiro</strong></p>`
        } else {
            res.innerHTML += `<p><strong>Estrangeiro</strong></p>`
        }
    }
    </script>
</body>
</html>
